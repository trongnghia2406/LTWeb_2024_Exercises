<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
    <title>Count Existence</title>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="container">
        <h1 class="text-center text-uppercase mb-3">Count Existence</h1>
        <div class="row mb-3">
            <label for="txtareaInput" class="form-label h4">Enter a paragraph: </label>
            <textarea name="" id="txtareaInput" rows="10" class="form-control">
            </textarea>
        </div>
        <div class="row">
            <label for="textfieldInput" class="form-label h4">Enter a line:</label>
            <input type="text" id="textfieldInput" class="form-control">
        </div>
        <div class="row mt-4">
            <button id="countBtn" class="btn btn-primary">Button</button>
        </div>
        <div id="result" class="row alert alert-info mt-3" role="alert"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>
    <script src="./main.js"></script>
</body>

</html>
